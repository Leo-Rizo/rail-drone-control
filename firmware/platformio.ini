[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_native
build_src_filter =
    -<*>
    +<control/*.cpp>
    +<core/*.cpp>
    +<safety/*.cpp>
    +<telemetry/*.cpp>
build_flags = -std=c++11
